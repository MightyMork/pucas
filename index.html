<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Púcas Cards</title>
<meta name="theme-color" content="#121B33">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icons/rua-favicon-64.png">
<link rel="apple-touch-icon" href="icons/rua-apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Numbers in the pixel font: its 5, 8 and 2 look like S and 8, so digits 0-9 are drawn in Andika (the reading font).
   Words keep the pixel look. If this font can't load, the pixel font draws the digits as before. */
@font-face{font-family:"PxDigits";font-weight:400 600;font-display:swap;src:url(https://fonts.gstatic.com/s/andika/v27/mem_Ya6iyW-LwqgwarYQ.woff2) format("woff2");unicode-range:U+0030-0039}
@font-face{font-family:"PxDigits";font-weight:700 900;font-display:swap;src:url(https://fonts.gstatic.com/s/andika/v27/mem8Ya6iyW-Lwqg40ZMFVZ0b.woff2) format("woff2");unicode-range:U+0030-0039}
:root{--navy:#121B33;--night:#1c1a2e;--ink:#f3e6cc;--cream:#fff4d6;--soft:#b9afd0;--gold:#E3B23C;--line:#4a4370;--emer:#2fbf71}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{overflow-x:hidden} /* v29: the page never scrolls sideways */
.hfan{max-width:100%;overflow-x:clip}
body{background:var(--night);color:var(--ink);font-family:'Andika',sans-serif;font-size:18px;line-height:1.35;overflow-x:hidden;scrollbar-width:none}
body::-webkit-scrollbar{display:none}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:
 radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,#fff9 50%,transparent 51%),
 radial-gradient(2px 2px at 40% 30%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 88% 40%,#fff8 50%,transparent 51%),
 radial-gradient(2px 2px at 20% 70%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 60% 82%,#fff7 50%,transparent 51%),
 linear-gradient(#121B33,#1c1a2e 60%,#231c3a)}
img{-webkit-user-drag:none;user-select:none}
[data-drag]{touch-action:none;user-select:none;-webkit-user-select:none}
.av{display:inline-block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:disabled{cursor:default}
.px{font-family:"PxDigits",'Pixelify Sans',monospace}
.notch{clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 3px) calc(100% - 8px),calc(100% - 3px) calc(100% - 3px),calc(100% - 8px) calc(100% - 3px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 8px),0 calc(100% - 8px),0 8px,3px 8px,3px 3px,8px 3px)}
#pbar{position:sticky;top:0;z-index:30;height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#0b1022;border-bottom:1px solid #2b2850;font-size:13px;color:var(--soft)}
#pbar .pback{color:var(--gold);text-decoration:none;font-weight:700;padding:6px 4px;font-size:15px}
#psync{font-size:12px;color:#e8a24a}
#pbar b{color:var(--gold);font-family:"PxDigits",'Pixelify Sans',monospace;letter-spacing:1px;font-weight:500}
#pbar .sp{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar button{background:#232040;border:1px solid #3b3766;border-radius:8px;padding:5px 10px;font-size:13px;position:relative;min-height:30px}
.badge{position:absolute;top:-6px;right:-6px;background:#ef7a3a;color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
#app{max-width:520px;margin:0 auto;padding:10px 12px 40px}
h1,h2{font-family:"PxDigits",'Pixelify Sans',monospace;color:var(--gold);font-weight:700;margin:6px 0 10px;letter-spacing:.5px}
h1{font-size:30px}h2{font-size:22px}
.sub{color:var(--soft);font-size:16px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:10px 14px;background:var(--gold);color:#241a05;font-weight:700;font-size:20px;box-shadow:inset -4px -4px 0 #a97c1c,inset 4px 4px 0 #f7d27a;text-align:center;line-height:1.15}
.btn:active{transform:translateY(2px)}
.btn.alt{background:#2c2852;color:var(--ink);box-shadow:inset -4px -4px 0 #1a1733,inset 4px 4px 0 #3f3a72}
.btn.green{background:#2fa36b;color:#05210f;box-shadow:inset -4px -4px 0 #1d6e46,inset 4px 4px 0 #5fd29a}
.btn.small{min-height:46px;font-size:17px}
.btn:disabled{filter:grayscale(.8) brightness(.7)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 .btn{min-height:68px;height:100%}
.link{color:var(--soft);text-decoration:underline;font-size:16px;padding:10px 4px;min-height:44px}
.say{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#2c2852;flex:none}
.say svg{width:22px;height:22px}
.panel{background:rgba(35,32,64,.92);border:2px solid #3b3766;padding:14px;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:#2c2852;padding:6px 12px;border-radius:20px;font-size:16px}
.gem{display:inline-block;width:16px;height:16px;transform:rotate(45deg);background:var(--emer);border:2px solid #d9fbe6;box-shadow:inset -3px -3px 0 #168a4f;flex:none}
.gem.off{background:#2a2a44;border-color:#4a4370;box-shadow:none}
.gem.sm{width:11px;height:11px;border-width:1px}
.gems{display:inline-flex;gap:9px;align-items:center;padding:3px 5px}
.av{width:44px;height:44px;border:3px solid var(--gold);background:#2c2852 center/cover;flex:none;image-rendering:auto}
.av.big{width:76px;height:76px}
.av.lock{border-color:#4a4370;display:inline-flex;align-items:center;justify-content:center}

/* cards (base 240x336, scaled with zoom) */
.tcw{display:inline-block;vertical-align:top}
.tc{width:240px;height:336px;padding:6px;background:var(--tcol);position:relative}
.tc.leg{background:linear-gradient(135deg,#F2B544,#FFF1C2 45%,#F2B544)}
.tc .in{height:100%;background:linear-gradient(#232040,#1c1a2e);border:2px solid var(--tdark);padding:7px 8px 5px;display:flex;flex-direction:column;gap:4px}
.tc .top{display:flex;align-items:center;gap:6px}
.tc .nm{font-family:"PxDigits",'Pixelify Sans',monospace;font-weight:700;font-size:20px;line-height:1;color:var(--cream)}
.tc .ga{font-size:11px;color:var(--soft)}
.tc .pf{text-align:right;font-family:"PxDigits",'Pixelify Sans',monospace;line-height:1}
.tc .pf small{display:block;font-size:8px;letter-spacing:1px;color:var(--soft)}
.tc .pf b{font-size:17px;color:var(--cream)}
.tbadge{width:22px;height:22px;border-radius:50%;background:var(--tcol);border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;vertical-align:middle}
.tbadge svg{width:13px;height:13px}
.tc .art{height:118px;border:3px solid var(--tdark);outline:1px solid var(--tcol);background-size:cover;background-position:50% 62%;position:relative;overflow:hidden;flex:none}
.tc .art img{position:absolute;left:50%;bottom:4px;height:92%;transform:translateX(-50%)}
.tc .wh{font-size:10px;color:#d9cdb3;text-align:center}
.tc .mv{display:flex;align-items:center;gap:6px;background:rgba(243,230,204,.07);border-radius:4px;padding:3px 5px}
.tc .mv .c{width:30px;display:flex;gap:3px;justify-content:center;flex:none}
.tc .mv .c i{display:inline-block;width:7px;height:7px;background:var(--tcol);border:1px solid var(--ink);transform:rotate(45deg)}
.tc .mv b{font-size:12px;display:block;line-height:1.1}
.tc .mv span{font-size:9px;color:#d9cdb3;display:block;line-height:1.2}
.tc .mv .p{font-family:"PxDigits",'Pixelify Sans',monospace;font-weight:700;font-size:17px;color:var(--tcol);margin-left:auto}
.tc .sc{display:flex;justify-content:space-between;font-size:10px;color:#d9cdb3;align-items:center}
.tc .sc .tbadge{width:14px;height:14px;border-width:1px}
.tc .sc .tbadge svg{width:8px;height:8px}
.tc .ft{margin-top:auto;display:flex;justify-content:space-between;font-family:"PxDigits",'Pixelify Sans',monospace;font-size:7.5px;letter-spacing:.5px;color:var(--soft)}
.tc .mine{position:absolute;top:-2px;left:50%;transform:translateX(-50%);background:var(--gold);color:#241a05;font-family:"PxDigits",'Pixelify Sans',monospace;font-size:10px;padding:1px 8px;white-space:nowrap;z-index:2}
.hc{width:240px;height:336px;padding:6px;background:#d9c9a0}
.hc .in{height:100%;background:#fbf3df;border:2px solid #8a7547;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#2a2238;text-align:center}
.hc .nm{font-family:"PxDigits",'Pixelify Sans',monospace;font-weight:700;font-size:22px;color:#3b2a10}
.hc .kind{font-size:11px;letter-spacing:2px;color:#8a7547;font-family:"PxDigits",'Pixelify Sans',monospace}
.hc .pic{width:150px;height:130px;display:flex;align-items:center;justify-content:center;background:#efe2c0;border:3px solid #8a7547}
.hc .pic img{max-width:100px;max-height:100px}
.hc .pic svg{width:96px;height:96px}
.hc .d{font-size:17px;line-height:1.3}
.hc .ft{margin-top:auto;font-family:"PxDigits",'Pixelify Sans',monospace;font-size:8px;color:#8a7547}
.sb{width:240px;height:336px;padding:6px;background:#f2b544}
.sb .in{height:100%;background:#f6ecd6;border:2px solid #7a5a12;padding:10px 11px 6px;display:flex;flex-direction:column;gap:5px;color:#2b2238}
.sb .hd{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--tcol);padding-bottom:4px}
.sb .hd b{flex:1;font-family:"PxDigits",'Pixelify Sans',monospace;font-size:16px;color:#1c1a2e}
.sb .k{font-family:"PxDigits",'Pixelify Sans',monospace;font-size:8px;letter-spacing:1.5px;color:var(--tdark)}
.sb p{margin:0;font-size:10.5px;line-height:1.3}
.sb .ft{margin-top:auto;font-family:"PxDigits",'Pixelify Sans',monospace;font-size:7px;color:#5a4a6e;display:flex;justify-content:space-between}
.cb{width:240px;height:336px;padding:6px;background:linear-gradient(135deg,#F2B544,#FFF1C2 45%,#F2B544)}
.cb .in{height:100%;border:2px solid #7a5a12;background:radial-gradient(1px 1px at 20% 20%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 30%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 40% 75%,#fffa 50%,transparent 51%),radial-gradient(1px 1px at 85% 80%,#fff 50%,transparent 51%),linear-gradient(#1a2550,#121B33 55%,#231c3a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.logo{font-family:"PxDigits",'Pixelify Sans',monospace;font-weight:700;font-size:44px;line-height:1;color:#fff4d6;text-shadow:3px 3px 0 #000;position:relative;letter-spacing:2px}
.logo:after{content:"";position:absolute;left:46%;top:-14px;width:10px;height:10px;border-radius:50%;background:#7fe0cf;box-shadow:0 0 10px 4px #3fb7a6aa}
.cb .w{font-family:"PxDigits",'Pixelify Sans',monospace;font-size:12px;letter-spacing:3px;color:var(--gold)}
.flip3d{perspective:900px;display:inline-block;cursor:pointer}
.flip3d .fi{position:relative;transition:transform .6s;transform-style:preserve-3d}
.flip3d.flipped .fi{transform:rotateY(180deg)}
.flip3d .ff,.flip3d .fb{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip3d .fb{position:absolute;inset:0;transform:rotateY(180deg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;justify-items:center}
.grid .tcw{zoom:.62}
.hero{position:relative;height:250px;background-size:cover;background-position:50% 65%;border:3px solid #3b3766;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#1c1a2ecc)}
.hero img{position:absolute;left:50%;bottom:16px;height:145px;transform:translateX(-50%);z-index:1;animation:bob 2.4s ease-in-out infinite}
.hero .lbl{position:absolute;left:12px;bottom:10px;z-index:2}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.who{display:flex;align-items:center;gap:14px;width:100%;padding:12px;margin:10px 0;background:#2c2852;border:2px solid #3b3766;min-height:104px;text-align:left}
.who .n{font-family:"PxDigits",'Pixelify Sans',monospace;font-size:28px;color:var(--cream)}

/* the table */
.mtop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.turnpill{font-family:"PxDigits",'Pixelify Sans',monospace;font-size:13px;padding:4px 8px;background:var(--gold);color:#241a05;white-space:nowrap}
.turnpill.r{background:#7a5a9e;color:#fff}
.rhand{display:flex}
.rhand .tcw{zoom:.1;margin-left:-60px}
.rhand .tcw:first-child{margin-left:0}
.mat{position:relative;height:392px;border:3px solid #3b3766;background-size:cover;background-position:50% 70%;overflow:hidden;touch-action:pan-y}
.mat:before{content:"";position:absolute;inset:0;background:linear-gradient(#0d0b1f99,#0d0b1f22 45%,#0d0b1faa)}
.mat .stgl{position:absolute;left:45%;bottom:10px;transform:translateX(-50%);font-family:"PxDigits",'Pixelify Sans',monospace;font-size:11px;color:#fff;background:#0008;padding:2px 8px;white-space:nowrap;z-index:1;letter-spacing:1px}
.mat.drop{outline:4px dashed var(--gold);outline-offset:-8px}
.slotc{position:absolute;z-index:3}
.slotc .tcw{zoom:.4}
.slotc.mini .tcw{zoom:.24}
.slotc.out{opacity:.35;filter:grayscale(1)}
.slotc.drop{outline:3px dashed var(--gold);outline-offset:3px}
.pt{position:absolute;left:0;right:0;bottom:0;background:#000c;padding:2px 4px;z-index:4}
.bar{height:8px;background:#2a2a44;border:1px solid #000;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#5fd29a;transition:width .6s}
.bar i.mid{background:#f2c14e}.bar i.low{background:#ef7a3a}
.pnum{font-family:"PxDigits",'Pixelify Sans',monospace;font-size:12px;color:#fff;text-align:center;line-height:1.1}
.spr{position:absolute;height:112px;z-index:4;transition:transform .25s,opacity .5s;filter:drop-shadow(0 4px 2px #000a);pointer-events:none}
.spr.k{left:30%;bottom:98px}
.spr.r{right:30%;top:58px;transform:scaleX(-1)}
.spr.k.lunge{transform:translate(36px,-36px) scale(1.08)}
.spr.r.lunge{transform:scaleX(-1) translate(36px,36px) scale(1.08)}
.shake{animation:shk .45s}
.spr.gone{opacity:0}
@keyframes shk{0%,100%{translate:0}20%{translate:-8px}40%{translate:8px}60%{translate:-6px}80%{translate:6px}}
.float{position:absolute;z-index:6;font-family:"PxDigits",'Pixelify Sans',monospace;font-weight:700;font-size:42px;color:#fff;text-shadow:3px 3px 0 #000,-2px -2px 0 #000;animation:flt 1.1s ease-out forwards;pointer-events:none}
.float.heal{color:#5fd29a}
@keyframes flt{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-50px) scale(1.15)}}
.fx{position:absolute;z-index:5;display:flex;gap:4px;font-size:12px}
.fx span{background:#000c;padding:1px 6px;border-radius:4px}
.gpile{position:absolute;z-index:5;display:flex;gap:7px;background:#000a;padding:5px 7px}
.msg{display:flex;align-items:center;gap:10px;min-height:60px;background:#2c2852;border:2px solid #3b3766;padding:6px 10px;margin:8px 0;font-size:18px}
.little .msg{font-size:23px;min-height:72px}
.msg .t{flex:1}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mvb{background:#2c2852;border:3px solid var(--tcol);padding:8px;text-align:left;min-height:80px;display:flex;flex-direction:column;gap:4px;position:relative;width:100%}
.mvb .n{font-weight:700;font-size:18px;line-height:1.1}
.mvb .p{font-family:"PxDigits",'Pixelify Sans',monospace;font-size:26px;color:var(--tcol);position:absolute;right:8px;bottom:6px}
.mvb .x{font-size:12px;background:#ef7a3a;color:#fff;padding:1px 6px;border-radius:4px;align-self:flex-start}
.mvb:disabled{opacity:.45}
.mvb .need{font-size:13px;color:var(--soft)}
.little .mvb .need{max-width:62%}.little .mvb{min-height:116px}.little .mvb .n{font-size:24px}.little .mvb .p{font-size:44px}
.handwrap{position:relative;height:172px;padding-top:22px;margin-top:6px;display:flex;justify-content:center;align-items:flex-end}
.handwrap .lbl{position:absolute;left:0;top:0;font-size:13px;color:var(--soft)}
.hcard{position:relative;margin:0 -14px;transform-origin:50% 120%;transition:transform .2s;touch-action:none}
.hcard .tcw{zoom:.42}
.hcard:nth-child(2){transform:rotate(-9deg) translateY(8px)}
.hcard:nth-child(3){transform:rotate(0) translateY(-4px)}
.hcard:nth-child(4){transform:rotate(9deg) translateY(8px)}
.hcard.only{transform:none}
.hcard.dim{filter:brightness(.6)}
.actions{display:flex;gap:8px;margin-top:8px}
.gemrow{display:flex;align-items:center;gap:10px;padding:2px 12px 0;min-height:48px}
.gtok{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px 0 4px;border-radius:14px;background:#1c1a2e;border:2px solid #4a4470;color:#f5f1ff;font-family:'Andika',sans-serif;touch-action:none;text-align:left}
.gtok b{display:block;font-size:16px;line-height:1.1}.gtok small{display:block;font-size:13px;color:#b9afd0}
.gtok.can{border-color:var(--gold);filter:drop-shadow(0 0 2px #ffd54ab3) drop-shadow(0 0 6px #ffd54ab3)}
.gtok.used{color:#b9afd0;font-size:15px;padding:0 12px}
.gw{position:relative;display:block;flex:0 0 auto}
.gty{position:absolute;right:-7px;bottom:-5px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;color:#fff;box-shadow:0 1px 3px #000a}
.gty svg{width:12px;height:12px}
.gw.big .gty{width:22px;height:22px;right:-8px}
.gimg{display:block;width:30px;height:30px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 2px #0008)}
.gimg.big{width:38px;height:38px}
.pouch{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;min-height:44px;padding-left:2px}
.pouch::-webkit-scrollbar{display:none}
.pouch .pl{font-size:14px;color:var(--soft);margin-right:2px}.pouch .pe{font-size:14px;color:#8d85a8}
.pg{flex:0 0 auto;min-width:44px;min-height:44px;border-radius:12px;background:#1c1a2e;border:2px solid #4a4470;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none}
.pg.can{border-color:var(--gold)}
.ghost.gg{width:70px;height:70px;display:flex;align-items:center;justify-content:center;background:none;filter:drop-shadow(0 8px 10px #000b)}
.ghost.gg .gimg,.ghost.gg .gimg.big{width:60px;height:60px}
@media (prefers-reduced-motion:reduce){.gtok.can{filter:none}}
.ghost{position:fixed;z-index:90;pointer-events:none;transform:rotate(-4deg) scale(1.08);filter:drop-shadow(0 10px 12px #000c)}

/* setup */
.slots{display:flex;gap:10px;justify-content:center;align-items:flex-end}
.slotbox{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--soft)}
.slotbox .tcw{zoom:.42}
.slotbox.front .tcw{zoom:.5}
.stages{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.stages::-webkit-scrollbar{display:none}
.stg{flex:0 0 120px;height:96px;border:3px solid #3b3766;background-size:cover;background-position:50% 65%;position:relative;text-align:left}
.stg.on{border-color:var(--gold)}
.stg span{position:absolute;left:0;right:0;bottom:0;background:#000b;font-size:12px;padding:2px 5px;line-height:1.2}
.stg.lockd{background:#2a2744;display:flex;align-items:center;justify-content:center;color:var(--soft)}

/* overlays */
.ov{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#1f1c38;border-top:3px solid var(--gold);width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:14px 16px 28px;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.ov.center{align-items:center}
.ov.center .sheet{border:3px solid var(--gold);max-width:420px;margin:12px}

/* the new board (battle plan step 1, 23 Nov): one out front, two waiting, three dots, one "what now?" line */

.mtop{flex-wrap:nowrap}
.rhand{min-width:0;overflow:hidden}
.pf2{display:flex;align-items:baseline;justify-content:center;gap:6px;line-height:1}

.bd .bar{height:14px;margin-top:4px}

.ws{position:relative;z-index:1;min-height:104px;min-width:44px;border:3px solid var(--tcol,#6f68a0);background:#1c1a2eee;padding:4px 3px 5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;margin-bottom:6px}

function testCards() {
  const keep = kid;
  KIDS.forEach(k => {
    kid = k; const d = deck();
    Object.keys(C).forEach(x => { if (C[x].line !== S.kids[k].puca) d.own[x] = 1; });
    Object.keys(H).forEach(h => d.help[h] = Math.max(d.help[h] || 0, H[h].legend ? 1 : 2));
    d.met = Object.fromEntries(PEOPLE.map(p => [p[0], 1]));

}

/* ---------- toasts, sheets, PIN ---------- */
function toast(title, text, toDonri) {
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = (title ? `<b>${esc(title)}</b>` : "") + esc(text);
  if (toDonri) { t.style.cursor = "pointer"; t.onclick = () => { t.remove(); dTab = "ok"; glowReq = true; openDonri(); }; }
  document.body.appendChild(t); setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.remove(), 500); }, 4200);
}
function sheet(html, center) { $("#ovl").innerHTML = `<div class="ov${center ? " center" : ""}" data-act="bg"><div class="sheet">${html}</div></div>`; }
function closeSheet() { $("#ovl").innerHTML = ""; HOLD = null; }
let pinBuf = "", pinNext = null;
function pinPad() {
  pinBuf = "";
  sheet(`<h2 style="text-align:center">Grown-ups</h2><p class="sub" style="text-align:center">Enter the grown-up PIN from Donrí</p><p id="pinshow" class="px" style="text-align:center;font-size:34px;letter-spacing:10px;min-height:44px">····</p>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, "⌫"].map(n => n === "" ? "<span></span>" : `<button class="btn alt small" data-act="pin" data-n="${n}">${n}</button>`).join("")}</div>
  <button class="link" data-act="close" style="width:100%">Cancel</button>`, true);
}
function pinKey(n) {
  if (n === "⌫") pinBuf = pinBuf.slice(0, -1); else pinBuf += n;
  $("#pinshow").textContent = pinBuf.replace(/./g, "•").padEnd(4, "·");
  if (pinBuf.length >= 4) {
    if (LINK.pinOk(pinBuf)) { closeSheet(); unlockedUntil = Date.now() + 600000; const go = pinNext; pinNext = null; if (go) go(); else { kid = null; R = "who"; render(); } }
    else if (pinBuf.length >= 6) { pinBuf = ""; $("#pinshow").textContent = "Try again"; }
  }
}

/* ---------- one-off timers (grown-ups, behind the PIN) ---------- */
let TK = null;
function timerOpen(k) {
  TK = k || kid || KIDS[0]; if (!TK) return;
  if (!LINK.hasPin()) { toast("Grown-ups", "Set a grown-up PIN in Donrí first (Settings → Kid mode)."); return; }
  pinNext = () => timerSheet(TK); pinPad();
}
function timerSheet(k) {
  TK = k || TK; const x = S.kids[TK]; if (!x) return closeSheet();
  const kk = kid; kid = TK; const g = gate(); kid = kk;
  const lateOn = (x.lateUntil && Date.now() < x.lateUntil) || x.lateMins;
  const status = g === "sleep" ? "The Púcas are asleep (9pm–7am)." : g === "locked" ? "Playtime isn't unlocked yet today." : `${x.minsLeft} min left today.`;
  const pick = KIDS.length > 1 && S.device === "family" ? `<div class="opt">${KIDS.map(k2 => `<button class="${k2 === TK ? "on" : ""}" data-act="tkid" data-k="${k2}">${k2}</button>`).join("")}</div>` : "";
  const sofar = [x.gUnlock && !LINK.jobToday(TK) ? "unlocked by a grown-up" : "", x.extra ? `+${x.extra} min extra` : "",
    lateOn ? (x.lateUntil && Date.now() < x.lateUntil ? `up until ${new Date(x.lateUntil).toLocaleTimeString("en-IE", { hour: "numeric", minute: "2-digit" })}` : `${x.lateMins} min past 9 tonight`) : ""].filter(Boolean);
  sheet(`<h2>Playtime for ${TK}</h2>${pick}<p class="sub">${status} Shared with Púcas Cara.</p>
  ${!x.unlocked ? `<button class="btn" data-act="tunlock">Unlock playtime today</button><p class="sub">Same as doing a job.</p>` : ""}
  <h2 style="font-size:18px;margin-top:12px">Extra time, just for today</h2>
  <div class="tgrid">${[10, 15, 30].map(m => `<button class="btn alt" data-act="tadd" data-m="${m}">+${m} min</button>`).join("")}</div>
  <h2 style="font-size:18px;margin-top:12px">A bit later tonight</h2>
  <div class="tgrid">${[15, 30].map(m => `<button class="btn alt" data-act="tlate" data-m="${m}">+${m} min</button>`).join("")}${lateOn ? `<button class="btn alt" data-act="tlate" data-m="0">Cancel</button>` : ""}</div>
  <div class="tnote">${sofar.length ? `<b>Today so far:</b> ${sofar.join(", ")}.<br>` : ""}One-off: tomorrow goes back to the usual playtime. The usual daily minutes are set in Donrí.</div>
  <button class="btn small" data-act="close">Done</button>`);
}
function timerApply(kind, m) {
  const k = TK, x = S.kids[k]; if (!x) return;
  const d = LINK.playDoc(k), extra = Number(d.extraMins) || 0, limit = Number(LINK.kidSettings().playMins) || 10;
  let line;
  if (kind === "unlock") { playPut(k, { unlocked: true, extraMins: LINK.secsLeft(k) <= 0 ? extra + limit : extra }); line = `Playtime unlocked today for ${k}`; }
  if (kind === "add") { playPut(k, { extraMins: extra + m }); line = `+${m} min playtime today for ${k}`; }
  if (kind === "late") {
    const h = clockNow().h, bed = h >= 21 || h < 7;
    if (!m) { playPut(k, { lateUntil: 0, lateMins: 0 }); line = `Late night cancelled for ${k}`; }
    else {
      const top = Math.max(0, m - Math.floor(LINK.secsLeft(k) / 60));
      playPut(k, bed ? { lateUntil: Date.now() + m * 60000, lateMins: 0, extraMins: extra + top } : { lateMins: m, lateUntil: 0, extraMins: extra + top });
      line = bed ? `${k} can play ${m} more minutes tonight` : `${k} can play until ${m} minutes past 9 tonight`;
    }
  }
  timeUpPending = false;
  LINK.log("Extra playtime from a grown-up: " + line + " (Púcas Cards, just today)", "A grown-up");
  project(); SFX.tap();
  toast("Done", line + ". Just for today.");
  timerSheet(k); if (R !== "match") render();
}

/* ---------- taps ---------- */
document.addEventListener("click", e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "bg") { if (e.target === el) { closeSheet(); if (R !== "match") render(); } return; }
  ac();
  const inMatch = R === "match" && M;
  switch (a) {
    case "donri": case "grown": grownGate(); break;
    case "gmode": { const k = el.dataset.k; if (S.kids[k]) { S.kids[k].mode = el.dataset.m; save(); grownSheet(); if (R !== "match") render(); } break; }
    case "gtest": testCards(); save(); toast("Test cards", "Every card added to both kids' collections, for grown-up testing.", true); grownSheet(); break;
    case "glooks": looksSheet(); break;
    case "ginstall": doInstall(); break;
    case "playhere": PLAY_HERE = true; render(); break;
    case "gsync": LINK.sync(true).then(() => { project(); grownSheet(); }); break;
    case "looks": looksSheet(); break;
    case "howto": howTo(R === "match" && M ? (M.mode === "little" ? "little" : "normal") : null); break;
    case "intro": howTo(INTRO_M, +el.dataset.i); break;
    case "mhelp": if (M) matchHelp(); break;
    case "hvh": HVH.k = KIDS.find(k => k !== kid); hvhSheet(); break;
    case "hvhpick": HVH.k = el.dataset.k; hvhSheet(); break;
    case "hvhmode": HVH.m = el.dataset.m; hvhSheet(); break;
    case "hvhgo": if (gate()) { R = "home"; render(); break; } startHvh(); break;
    case "setopt": { const o = opts(); o[el.dataset.k] = el.dataset.k === "icons" ? +el.dataset.v : el.dataset.v; save(); looksSheet(); if (R === "match" && M) renderMatch(); else render(); break; }
    case "testcards": testCards(); toast("Prototype", "Both kids now have every card."); looksSheet(); if (R !== "match") render(); break;
    case "close": closeSheet(); if (R !== "match") render(); break;
    case "dtab": dTab = el.dataset.t; openDonri(); break;
    case "say": speak(el.dataset.t); break;
    case "sayline": SFX.tap(); speak(M.msg || ""); break;
    case "flip": el.classList.toggle("flipped"); SFX.flip(); if (el.classList.contains("flipped")) { const s = el.closest(".slide"); const i = s ? [...s.parentNode.children].indexOf(s) : -1; const it = HOLD && HOLD.items[i]; if (it && it.k === "puca") speak(C[it.id].name + ". " + ST[it.id].loves + "."); } break;
    case "nopuca": kid = null; NP_KID = el.dataset.k; R = "nopuca"; render(); speak(NP_SAY(NP_KID)); break;
    case "sayit": speak(el.dataset.t); break;
    case "pick": kid = el.dataset.k; deck(); R = "home"; SFX.tap(); render(); speak("Hi " + kid + "!"); break;
    case "who": kid = null; R = "who"; render(); break;
    case "lock": pinPad(); break;
    case "timer": timerOpen(kid); break;
    case "tkid": timerSheet(el.dataset.k); break;
    case "tunlock": timerApply("unlock"); break;
    case "tadd": timerApply("add", +el.dataset.m); break;
    case "tlate": timerApply("late", +el.dataset.m); break;
    case "gtime": TK = el.dataset.k; timerSheet(el.dataset.k); break;
    case "pin": pinKey(el.dataset.n); break;
    case "go": closeSheet(); R = el.dataset.r; SFX.tap(); render(); break;
    case "avatars": avatarSheet(); break;
    case "setav": deck().avatar = el.dataset.a; wrote("cards/" + kid, "Avatar changed"); save(); avatarSheet(); render(); break;
    case "setup": if (gate()) { R = "home"; render(); break; } setupMode = el.dataset.m; R = "setup"; render(); break;
    case "stage": deck().stage = el.dataset.s; save(); if ($(".sheet")) placesSheet(); render(); SFX.tap(); break;
    case "places": placesSheet(); break;
    case "pickslot": holdForSlot(+el.dataset.i); break;
    case "putslot": {
      const d = deck(), slot = +el.dataset.slot, id = el.dataset.id, tok = id === myId() ? "MY" : id, b = d.board.slice();
      const from = b.indexOf(tok); const cur = b[slot];
      if (from >= 0) { b[from] = cur; b[slot] = tok; } else { if (cur === "MY") { SFX.soft(); toastKid("Your own Púca always plays. Swap it with another spot instead."); break; } b[slot] = tok; }
      d.board = b; wrote("cards/" + kid, "Board: " + board().map(x => C[x].name).join(", ")); save(); closeSheet(); render(); SFX.card(); break;
    }
    case "play": if (gate()) { R = "home"; render(); break; } closeSheet(); startMatch(el.dataset.m); break;
    case "holdcol": holdCollection(+el.dataset.i); break;
      case "cft": CF.type = el.dataset.v; render(); SFX.tap(); break;
      case "cfs": CF.stage = CF.stage === +el.dataset.v ? 0 : +el.dataset.v; render(); SFX.tap(); break;
      case "cfr": CF.rar = CF.rar === +el.dataset.v ? 0 : +el.dataset.v; render(); SFX.tap(); break;
      case "cfo": CF.sort = el.dataset.v; render(); SFX.tap(); break;
      case "cfclear": CF = { type: "all", rar: 0, stage: 0, sort: CF.sort, open: CF.open }; render(); break;
      case "cftog": CF.open = !CF.open; render(); SFX.tap(); break;
    case "holdhelp": { const help = deck().help, ks = Object.keys(help).filter(k => help[k]); holdUp(ks.map(k => ({ k: "help", id: k })), +el.dataset.i, "Help cards"); break; }
    case "holdhand": if (inMatch) { const hi = +el.dataset.i, why = humanTurn() ? P.helpBlock(M, hi) : null; if (why) { setMsg(why, true); el.animate && el.animate([{ transform: "translateX(-4px)" }, { transform: "translateX(4px)" }, { transform: "none" }], { duration: 220 }); } else holdHand(hi); } break;
    case "pickmon": if (M && M.pick === VIEW && !busy) { const ev = P.pickNext(M, +el.dataset.i); if (ev) playEvents(); } break;
    case "holdboard": if (inMatch) holdBoard(+el.dataset.side, +el.dataset.i); break;
    case "holdgem": if (inMatch && M.auto) { const ks = M.sides[VIEW]; holdGem(el.dataset.p === "t" ? 0 : (ks.token ? 1 : 0) + (+el.dataset.p)); } break;
    case "placegem": kidAct(() => el.dataset.p === "t" ? P.placeToken(M, +el.dataset.to) : P.usePouch(M, +el.dataset.p, +el.dataset.to)); break;
    case "playhelp": kidAct(() => { const blk = P.helpBlock(M, +el.dataset.i); if (blk) { setMsg(blk, true); return false; } return P.playHelp(M, +el.dataset.i, el.dataset.to === undefined ? undefined : +el.dataset.to); }); break;
    case "move": { const mi = +el.dataset.i; if (M && humanTurn() && !busy && !P.canMove(M, mi)) { needNudge(mi); break; } kidAct(() => P.useMove(M, mi)); break; }
    case "swap": kidAct(() => P.swap(M, +el.dataset.i)); break;
    case "pass": kidAct(() => P.pass(M)); break;
    case "quit": sheet(`<h2>Stop this match?</h2><p>Your Púcas will go home for a rest.</p><button class="btn" data-act="close">Keep playing</button><button class="btn alt" data-act="quityes" style="margin-top:10px">Stop</button>`, true); break;
    case "quityes": closeSheet(); R = "home"; M = null; busy = false; VIEW = 0; try { speechSynthesis.cancel(); } catch (x) {} render(); break;
    case "ask": ask(); break;
    case "nevermind": { LINK.patch("cards", kid + "-pack", { req: null }); LINK.log(`${kid} said never mind to the card pack`, kid); project(); render(); break; }
    case "nevermind_old": { const r = S.requests.find(x => x.kid === kid && x.status === "waiting"); if (r) { r.status = "cancelled"; wrote("requests/" + r.id, kid + " said never mind"); S.inbox = S.inbox.filter(n => n.req !== r.id); save(); } render(); break; }
    case "seenNo": { const pk = LINK.doc("cards", kid + "-pack") || {}; LINK.patch("cards", kid + "-pack", { answer: { ...(pk.answer || {}), seen: true } }); project(); render(); break; }
    case "open": openPack(); break;
    case "packflip": packFlip(el); break;
    case "lvl": { const k = el.dataset.k, lv = Math.max(1, Math.min(40, level(k) + +el.dataset.d)); S.kids[k].xp = (lv - 1) * 20; save(); openDonri(); if (R !== "match") render(); break; }
    case "gems": { const k = el.dataset.k; S.kids[k].gems = Math.max(0, S.kids[k].gems + +el.dataset.d); save(); openDonri(); if (R !== "match") render(); break; }
    case "mins": { const k = el.dataset.k; S.kids[k].minsLeft = Math.max(0, Math.min(120, S.kids[k].minsLeft + +el.dataset.d)); save(); openDonri(); if (R !== "match") render(); break; }
    case "tunl": S.kids[el.dataset.k].unlocked = !S.kids[el.dataset.k].unlocked; save(); openDonri(); if (R !== "match") render(); break;
    case "tsp": S.kids[el.dataset.k].speech = !S.kids[el.dataset.k].speech; save(); openDonri(); break;
    case "tsn": S.kids[el.dataset.k].sound = !S.kids[el.dataset.k].sound; save(); openDonri(); break;
    case "tread": { const x = S.kids[el.dataset.k]; x.read = x.read || {}; x.read.setanta = !x.read.setanta; save(); openDonri(); break; }
    case "yes": case "no": { const by = ($("#asWho") || {}).value || "Mark"; answer(el.dataset.id, a === "yes", by); openDonri(); if (R === "packs" || R === "home") render(); updateBar(); break; }
    case "bellgo": dTab = "ok"; glowReq = true; openDonri(); break;
    case "bellx": S.inbox.splice(+el.dataset.i, 1); save(); openDonri(); break;
    case "reset": S = fresh(); save(); kid = null; R = "who"; M = null; closeSheet(); render(); break;
  }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-chg]"); if (!el) return;
  const c = el.dataset.chg, k = el.dataset.k;
  if (c === "puca") {
    const old = S.kids[k].puca; S.kids[k].puca = el.value;
    if (S.cards[k]) { const d = S.cards[k]; d.own[old] = 1; P.LINES[el.value].forEach(x => delete d.own[x]); d.board = ["MY"]; }
    S.kids[k].xp = 0;
    wrote("cards/" + k, `${k}'s Púca is now ${C[el.value].name}: it leads the deck`);
  }
  if (c === "mode") S.kids[k].mode = el.value;
  if (c === "device") { S.device = el.value; unlockedUntil = 0; kid = el.value === "family" ? null : el.value; R = kid ? "home" : "who"; M = null; }
  if (c === "clock") S.clock = el.value;
  save(); openDonri(); if (R !== "match") render();
});
/* ---------- the real link: screens before the game can start ---------- */
function linkScreen() {
  const st = LINK.state, home = `<a class="btn" href="/donrifamily/" style="display:block;text-align:center;text-decoration:none;max-width:320px;margin:16px auto 0">Open Donrí</a>`;
  if (!LINK.hasData && (st === "start" || st === "ok")) return `<div class="gate"><img src="img/dabbit-happy.png" alt=""><h1>Loading…</h1><p style="font-size:20px">Getting your cards from Donrí.</p></div>`;
  if (st === "nofile" || st === "signedout") return `<div class="gate"><img src="img/dabbit-asleep.png" alt=""><h1>Sign in first</h1><p style="font-size:20px">Open Donrí on this phone or tablet and sign in. Then come back to Púcas cards.</p>${home}</div>`;
  if (!LINK.hasData) return `<div class="gate"><img src="img/dabbit-tired.png" alt=""><h1>Can't reach Donrí</h1><p style="font-size:20px">Check the internet, then try again.</p><button class="btn" data-act="gsync" style="max-width:320px">Try again</button>${home}</div>`;
  if (!ALLKIDS.length) return `<div class="gate"><img src="img/dabbit-idle.png" alt=""><h1>No kids yet</h1><p style="font-size:20px">Add the kids in Donrí first.</p>${home}</div>`;

}
const renderGame = render;
render = function () {
  if (!isInstalled() && !PLAY_HERE && !(R === "match" || R === "result")) { updateBar(); $("#app").innerHTML = getAppScreen(); return; }
  const ls = linkScreen();
  if (ls) { updateBar(); $("#app").innerHTML = ls; return; }
  if (S.device !== "family" && noPucaKids().includes(S.device)) { updateBar(); NP_KID = S.device; $("#app").innerHTML = noPucaHTML(NP_KID); return; }
  if (kid && !KIDS.includes(kid)) { kid = null; R = "who"; }
  renderGame();
};
function grownGate() { if (!LINK.hasPin() || Date.now() < unlockedUntil) return grownSheet(); pinNext = grownSheet; pinPad(); }
function grownSheet() {
  const kidsRows = KIDS.map(k => { const x = S.kids[k]; return `<div class="card"><b style="font-size:18px">${k}</b>
    <div class="muted" style="margin:4px 0 8px">${C[P.myCard(x.puca, level(k))].name} · level ${level(k)} · ${x.gems} gems · ${x.unlocked ? (x.minsLeft > 0 ? x.minsLeft + " min playtime left" : "no playtime left") : "playtime locked until a job is done"}</div>
    <div class="row" style="gap:8px">${[["little", "Little (younger kids)"], ["normal", "Normal (bigger kids)"]].map(([m, n]) => `<button class="btn ${x.mode === m ? "" : "alt"} small" data-act="gmode" data-k="${k}" data-m="${m}" aria-pressed="${x.mode === m}">${n}</button>`).join("")}</div>
    <button class="btn alt small" data-act="gtime" data-k="${k}" style="margin-top:8px">⏱ Extra time today…</button></div>`; }).join("");
  sheet(`<h2>Grown-ups</h2><p class="sub">Gems, packs, the usual daily playtime and the PIN are set in Donrí. Extra time just for today can be given here. Card pack requests appear in Donrí under Waiting for your OK.</p>
  ${kidsRows}
  <div class="card"><div class="row wrap" style="gap:8px"><button class="btn alt small" data-act="glooks">Looks</button><button class="btn alt small" data-act="gsync">Sync now</button><button class="btn alt small" data-act="gtest">Add test cards</button></div>
  <p class="muted" style="margin:8px 0 0">Sync: ${LINK.state}${LINK.error ? " (" + String(LINK.error.message || LINK.error).slice(0, 80) + ")" : ""}. "Add test cards" gives both kids every card, for trying things out.</p></div>
  ${installCard()}
  <a class="btn" href="/donrifamily/" style="display:block;text-align:center;text-decoration:none">Back to Donrí</a>
  <button class="link" data-act="close" style="width:100%">Close</button>`);
}
// ---------- Its own app on the home screen (v24) ----------
let installEvt = null;
// The app starts at ./?app=1 (see app.webmanifest), so only the real Púcas Cards app counts as "installed".
// /pucas/ is outside Donrí's address, so "full screen" here can only be the Púcas Cards app itself.
const isInstalled = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (!isInstalled() && !PLAY_HERE) render(); });
addEventListener("appinstalled", () => { installEvt = null; toast("Púcas Cards", "Added to the home screen. Look for Rua!"); });
/* ---------- Púcas Cards is its own app (v26): in a browser or inside Donrí, show how to get it instead of the game ---------- */
let PLAY_HERE = false; // "Just play here this time" (until the page is closed)
const CHROME_URL = "intent://" + location.host + location.pathname + "#Intent;scheme=https;package=com.android.chrome;end";
function getAppScreen() {
  const how = installEvt
    ? `<button class="btn" data-act="ginstall" style="max-width:340px;display:block;margin:0 auto">📲 Install now</button>`

  <a class="btn" href="${/Android/i.test(navigator.userAgent) ? CHROME_URL : location.pathname}" style="max-width:340px;display:flex;align-items:center;justify-content:center;margin:0 auto;text-decoration:none">Download game</a>
  <p class="sub" style="max-width:340px;margin:10px auto">Already in Chrome? Tap <b>⋮</b> then <b>Install</b>.</p>`;

  ${how}
  <button class="link" data-act="playhere" style="width:100%">Just play here this time</button></div>`;
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
function installCard() {
  const body = isInstalled() ? `<p class="muted" style="margin:0">✓ This is the Púcas Cards app.</p>`
    : installEvt ? `<button class="btn alt small" data-act="ginstall">📲 Add Púcas Cards to the home screen</button><p class="muted" style="margin:8px 0 0">Its own app with Rua's picture. Donrí stays its own app beside it.</p>`
    : `<p class="muted" style="margin:0">To add it to the home screen: in Chrome, tap ⋮ then <b>Add to home screen</b> (or <b>Install app</b>). If it's already there, look for Rua.</p>`;
  return `<div class="card"><b style="font-size:18px">On the home screen</b><div style="margin-top:8px">${body}</div></div>`;
}
async function doInstall() {
  if (!installEvt) return $(".ov") ? grownSheet() : render();
  const fromSheet = !!$(".ov");
  installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {}
  installEvt = null; fromSheet ? grownSheet() : render();
}
/* ---------- Android Back button: handled inside the game ----------
   While there is somewhere to go back to, one extra "guard" history entry is kept. A Back press
   uses it up; the game then steps back one place (closes a pop-up or held card, asks "Stop this
   match?", goes back to home, then to Who's playing) and puts the guard back. On the first screen
   there is no guard, so Back leaves Púcas Cards in one press. */
let backGuarded = false, backIgnore = 0;
function backRoot() {
  if ($("#ovl") && $("#ovl").innerHTML.trim()) return false;
  if (!isInstalled() && !PLAY_HERE && !(R === "match" || R === "result")) return true; // "get the app" screen
  return !kid || R === "who" || R === "nopuca";
}
function backSync() {
  const need = !backRoot();
  if (need && !backGuarded) { history.pushState({ pcGuard: 1 }, ""); backGuarded = true; }
  else if (!need && backGuarded) { backGuarded = false; backIgnore++; history.back(); }
}
function backStep() {
  const ov = $("#ovl"), busyOv = ov && ov.innerHTML.trim() && !$(".ov") && !$(".hold");
  if ($(".hold") || $(".ov")) { closeSheet(); if (R !== "match") render(); return; }
  if (R === "match") { if (busy || busyOv) return; const q = $('[data-act="quit"]'); if (q) q.click(); return; } // hand-overs and animations: Back waits
  if (busyOv) return;
  if (R === "result") { R = "home"; M = null; VIEW = 0; render(); return; }
  if (R !== "home") { R = "home"; render(); return; }
  if (S.device === "family") kid = null;
  R = "who"; render();
}
addEventListener("popstate", () => {
  if (backIgnore) { backIgnore--; return; }
  backGuarded = false; backStep(); setTimeout(backSync, 0);
});
{ const r0 = render; render = function () { r0(); backSync(); }; }
{ const s0 = sheet; sheet = function (...a) { s0(...a); backSync(); }; }
{ const c0 = closeSheet; closeSheet = function () { c0(); setTimeout(backSync, 0); }; }
LINK.on(kind => {

  if (R === "match" || R === "result" || $(".ov") || PACK) { updateBar(); return; }
